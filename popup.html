<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #12141a;
      --panel: #1a1d26;
      --text: #e8eaef;
      --muted: #8b92a5;
      --accent: #3dd68c;
      --accent-dim: #1f6b4a;
      --danger: #ff5c5c;
      --warn: #f0b429;
      --track: #2a2f3c;
    }

    * { box-sizing: border-box; }

    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: "SF Pro Text", "Segoe UI", sans-serif;
      background: radial-gradient(120% 100% at 0% 0%, #1c2230 0%, var(--bg) 55%);
      color: var(--text);
    }

    h3 {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0.01em;
    }

    .subtitle {
      margin: 0 0 14px;
      font-size: 11px;
      color: var(--muted);
    }

    button {
      width: 100%;
      margin: 0 0 8px;
      padding: 10px 12px;
      font-weight: 650;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #start { background: var(--accent); color: #062416; }
    #stop { background: var(--danger); color: #fff; }

    #status {
      font-size: 12px;
      color: var(--muted);
      margin: 2px 0 12px;
      min-height: 16px;
    }

    #status.error { color: var(--danger); }

    .mic-panel {
      display: none;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 12px;
    }

    .mic-panel.visible { display: block; }

    .mic-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .mic-label {
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .mic-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--track);
      color: var(--muted);
    }

    .mic-badge.live {
      background: rgba(61, 214, 140, 0.15);
      color: var(--accent);
    }

    .mic-badge.muted {
      background: rgba(255, 92, 92, 0.15);
      color: var(--danger);
    }

    .mic-badge.missing {
      background: rgba(240, 180, 41, 0.15);
      color: var(--warn);
    }

    .meter-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mic-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--track);
      color: var(--muted);
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .mic-icon.active {
      background: rgba(61, 214, 140, 0.18);
      color: var(--accent);
      box-shadow: 0 0 0 3px rgba(61, 214, 140, 0.12);
    }

    .mic-icon.muted {
      background: rgba(255, 92, 92, 0.15);
      color: var(--danger);
    }

    .mic-icon svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .meter-track {
      flex: 1;
      height: 10px;
      border-radius: 999px;
      background: var(--track);
      overflow: hidden;
      position: relative;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent-dim), var(--accent));
      box-shadow: 0 0 12px rgba(61, 214, 140, 0.45);
      transition: width 0.05s linear;
    }

    .meter-fill.silent {
      box-shadow: none;
      background: #3a4154;
    }

    .meter-fill.muted {
      width: 0% !important;
      box-shadow: none;
    }

    .meter-hint {
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
      text-align: left;
    }

    #recBanner {
      display: none;
      margin: 0 0 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(217, 48, 37, 0.15);
      color: #f28b82;
      font-size: 12px;
      font-weight: 650;
    }

    #recBanner.visible { display: block; }

    #captionStatus {
      display: none;
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11px;
      color: var(--muted);
      text-align: left;
      line-height: 1.35;
      max-height: 72px;
      overflow: hidden;
    }

    #captionStatus.visible { display: block; }
    #captionStatus.waiting { border-color: rgba(240, 180, 41, 0.35); color: var(--warn); }
    #captionStatus.live { border-color: rgba(61, 214, 140, 0.35); color: var(--accent); }
  </style>
</head>
<body>
  <h3>Google Meet Recorder</h3>
  <div class="subtitle">Chrome extension · video + .vtt</div>
  <div id="recBanner">● Recording — toolbar shows REC</div>
  <button id="start">Start Recording</button>
  <button id="stop" disabled>Stop Recording</button>
  <div id="status">Status: Idle</div>
  <div id="captionStatus"></div>

  <div id="micPanel" class="mic-panel">
    <div class="mic-header">
      <span class="mic-label">Microphone</span>
      <span id="micBadge" class="mic-badge">Idle</span>
    </div>
    <div class="meter-wrap">
      <div id="micIcon" class="mic-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
        </svg>
      </div>
      <div class="meter-track">
        <div id="meterFill" class="meter-fill"></div>
      </div>
    </div>
    <div id="meterHint" class="meter-hint">Waiting for mic input…</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
